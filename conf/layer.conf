# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-lastandfast"
BBFILE_PATTERN_meta-lastandfast = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-lastandfast = "6"

LAYERDEPENDS_meta-lastandfast = "core"
LAYERSERIES_COMPAT_meta-lastandfast = "scarthgap"
